# ══════════════════════════════════════════════════
#   Distributed Task Execution System — Configuration
# ══════════════════════════════════════════════════

# ── Master ──────────────────────────────────────
# Host where the Master runs (used by clients and slaves)
server.host=localhost

# Port for CLIENT connections
server.port=5000

# Port for SLAVE self-registration (slaves connect here at startup)
server.reg.port=5001

server.maxClients=50

# ── Slaves ───────────────────────────────────────
# Slaves now register DYNAMICALLY — no need to list them here.
# This host is what the slave advertises to the master (change if on remote machine)
slave.host=localhost

# How long to wait for a slave response (ms)
slave.timeout=10000

# How many times to retry a failed slave
slave.retry=2

# ── Threads ──────────────────────────────────────
thread.pool.size=10

# ── Paths ────────────────────────────────────────
temp.dir=tmp
data.dir=data
logs.dir=logs

# ── Execution mode ───────────────────────────────
# This is now chosen PER TASK by the client — this default is ignored
execution.mode=distributed

# ── Progress Tracking (Observer Pattern) ─────────
# Enable or disable real-time progress reporting to clients (true/false)
progress.enabled=true

# Minimum percentage step before pushing a new update to the client
# (set to 1 to send every update, higher values reduce network chatter)
progress.min.step=1
